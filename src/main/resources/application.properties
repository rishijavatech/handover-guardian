spring.application.name=guardian-service
server.port=8082

management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
logging.level.org.springframework.web.client.RestTemplate=INFO
logging.level.com.netflix.discovery=INFO
logging.level.org.springframework.cloud.netflix.eureka=INFO
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.url=jdbc:postgresql://${DB_URL:localhost}:5432/auth-db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Abc@12345}
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.jackson.deserialization.fail-on-unknown-properties=true

#redis config
redis.host=localhost
redis.port=6379
redis.useSsl=false

jwt.token.secret.key=mysecret123mysecret123mysecret12345






